TRAIN:
  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: False
    DATA_FORMAT: NCDHW
    DATA_PATH: "PATH/TO/RAW_DATASETS/UBFC-rPPG/DATASET_2"
    CACHED_PATH: "datasets/UBFC-rPPG/preprocessed"
    FILE_LIST_PATH: "datasets/UBFC-rPPG/file_lists/train.csv"
    LMDB_PATH: "datasets/UBFC_rPPG/lmdb"
    BEGIN: 0.0
    END: 0.8
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized']
      DATA_AUG: ['None']
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 128
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'RF'
        RETINAFACE_MODEL_PATH: "weights/retinaface/Resnet50_Final.pth"
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 32
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 72
        W: 72

